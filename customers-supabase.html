<!DOCTYPE html>
<html>
<head>
    <title>Customer Management - Supabase</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="dashboard-supabase.html">Dashboard</a> |
    <a href="customers-supabase.html">Customers</a> |
<a href="vehicles-supabase.html">Vehicles</a> |
<a href="mechanics-supabase.html">Mechanics</a> |
<a href="inventory-supabase.html">Inventory</a> |
<a href="services-supabase.html">Services</a> |
<a href="billing-supabase-v2.html">Billing</a> |
<a href="reports-supabase.html">Reports</a> |
<a href="index.html">Logout</a>

</nav>

<h1>Customer Management</h1>

<hr>

<h3>Add New Customer</h3>

<input type="text" id="name" placeholder="Full Name">

<br><br>

<input type="text" id="contact" placeholder="Contact Number">

<br><br>

<input type="email" id="email" placeholder="Email">

<br><br>

<input type="text" id="address" placeholder="Address">

<br><br>

<button onclick="saveCustomer()">
    Save Customer
</button>

<hr>

<h3>Search Customer</h3>

<input
    type="text"
    id="searchInput"
    placeholder="Search Customer..."
    onkeyup="searchCustomer()">

<hr>

<h3>Customer Records</h3>

<table border="1" id="customerTable">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Contact</th>
    <th>Email</th>
    <th>Address</th>
    <th>Actions</th>
</tr>

</table>

<script>

const supabaseUrl =
"https://vopmdpaxxqejttenxcge.supabase.co";

const supabaseKey =
"sb_publishable_VrWfYD5jljm4i1g14UkasA_jo1lB3IM";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let editCustomerId = null;

window.onload = function(){

    loadCustomers();

};

async function loadCustomers(){

    const { data, error } =
        await client
        .from("customers")
        .select("*")
        .order("id");

    if(error){

        alert(error.message);
        return;

    }

    let table =
        document.getElementById("customerTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
    `;

    data.forEach(customer => {

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + customer.id + "</td>" +
            "<td>" + customer.name + "</td>" +
            "<td>" + customer.contact + "</td>" +
            "<td>" + customer.email + "</td>" +
            "<td>" + customer.address + "</td>" +
            "<td>" +
            "<button onclick='editCustomer(" + customer.id + ")'>Edit</button> " +
            "<button onclick='deleteCustomer(" + customer.id + ")'>Delete</button>" +
            "</td>";

    });

}

async function saveCustomer(){

    let name =
        document.getElementById("name").value;

    let contact =
        document.getElementById("contact").value;

    let email =
        document.getElementById("email").value;

    let address =
        document.getElementById("address").value;

    if(
        name === "" ||
        contact === "" ||
        email === "" ||
        address === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    if(editCustomerId === null){

        const { error } =
            await client
            .from("customers")
            .insert([
                {
                    name: name,
                    contact: contact,
                    email: email,
                    address: address
                }
            ]);

        if(error){

            alert(error.message);
            return;

        }

    }
    else{

        const { error } =
            await client
            .from("customers")
            .update({
                name: name,
                contact: contact,
                email: email,
                address: address
            })
            .eq("id", editCustomerId);

        if(error){

            alert(error.message);
            return;

        }

        editCustomerId = null;

    }

    document.getElementById("name").value = "";
    document.getElementById("contact").value = "";
    document.getElementById("email").value = "";
    document.getElementById("address").value = "";

    loadCustomers();

}

async function editCustomer(id){

    const { data, error } =
        await client
        .from("customers")
        .select("*")
        .eq("id", id)
        .single();

    if(error){

        alert(error.message);
        return;

    }

    document.getElementById("name").value =
        data.name;

    document.getElementById("contact").value =
        data.contact;

    document.getElementById("email").value =
        data.email;

    document.getElementById("address").value =
        data.address;

    editCustomerId = id;

}

async function deleteCustomer(id){

    if(!confirm("Delete this customer?")){

        return;

    }

    const { error } =
        await client
        .from("customers")
        .delete()
        .eq("id", id);

    if(error){

        alert(error.message);
        return;

    }

    loadCustomers();

}

function searchCustomer(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#customerTable tr"
        );

    rows.forEach(function(row,index){

        if(index === 0) return;

        let text =
            row.textContent.toLowerCase();

        if(text.includes(input)){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>

</body>
</html>
