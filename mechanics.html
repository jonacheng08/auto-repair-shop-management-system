<h1>Mechanic Management</h1>

<hr>

<h3>Add New Mechanic</h3>

<input type="text" id="mechanicName" placeholder="Mechanic Name">

<br><br>

<input type="text" id="contactNumber" placeholder="Contact Number">

<br><br>

<input type="text" id="specialization" placeholder="Specialization">

<br><br>

<select id="status">
    <option value="">Select Status</option>
    <option>Active</option>
    <option>Inactive</option>
</select>

<br><br>

<button onclick="addMechanic()">Add Mechanic</button>

<hr>

<h3>Search Mechanic</h3>

<input
    type="text"
    id="searchInput"
    placeholder="Search Mechanic..."
    onkeyup="searchMechanic()">

<br><br>

<h3>Mechanic Records</h3>

<table border="1" id="mechanicTable">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Contact Number</th>
    <th>Specialization</th>
    <th>Status</th>
    <th>Actions</th>
</tr>

</table>
<script>

let mechanicId =
    Number(localStorage.getItem("mechanicId")) || 1;

let editMechanicId = null;

window.onload = function() {

    loadMechanics();

};

function loadMechanics() {

    let mechanics =
        JSON.parse(
            localStorage.getItem("mechanics")
        ) || [];

    let table =
        document.getElementById("mechanicTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact Number</th>
            <th>Specialization</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    `;

    mechanics.forEach(function(mechanic){

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + mechanic.id + "</td>" +
            "<td>" + mechanic.name + "</td>" +
            "<td>" + mechanic.contact + "</td>" +
            "<td>" + mechanic.specialization + "</td>" +
            "<td>" + mechanic.status + "</td>" +
            "<td>" +
            "<button onclick='editMechanic(this)'>Edit</button> " +
            "<button onclick='deleteMechanic(this)'>Delete</button>" +
            "</td>";

    });

}

function addMechanic() {

    let name =
        document.getElementById("mechanicName").value;

    let contact =
        document.getElementById("contactNumber").value;

    let specialization =
        document.getElementById("specialization").value;

    let status =
        document.getElementById("status").value;

    if(
        name === "" ||
        contact === "" ||
        specialization === "" ||
        status === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    let mechanics =
        JSON.parse(
            localStorage.getItem("mechanics")
        ) || [];

    if(editMechanicId !== null){

        mechanics = mechanics.filter(
            mechanic =>
            mechanic.id != editMechanicId
        );

        mechanics.push({
            id: Number(editMechanicId),
            name: name,
            contact: contact,
            specialization: specialization,
            status: status
        });

        editMechanicId = null;

    }
    else{

        mechanics.push({
            id: mechanicId,
            name: name,
            contact: contact,
            specialization: specialization,
            status: status
        });

        mechanicId++;

    }

    localStorage.setItem(
        "mechanics",
        JSON.stringify(mechanics)
    );

    localStorage.setItem(
        "mechanicId",
        mechanicId
    );

    document.getElementById("mechanicName").value = "";
    document.getElementById("contactNumber").value = "";
    document.getElementById("specialization").value = "";
    document.getElementById("status").value = "";

    loadMechanics();

}

function deleteMechanic(button){

    let row =
        button.closest("tr");

    let id =
        row.cells[0].innerText;

    let mechanics =
        JSON.parse(
            localStorage.getItem("mechanics")
        ) || [];

    mechanics = mechanics.filter(
        mechanic =>
        mechanic.id != id
    );

    localStorage.setItem(
        "mechanics",
        JSON.stringify(mechanics)
    );

    loadMechanics();

}

function editMechanic(button){

    let row =
        button.closest("tr");

    editMechanicId =
        row.cells[0].innerText;

    document.getElementById("mechanicName").value =
        row.cells[1].innerText;

    document.getElementById("contactNumber").value =
        row.cells[2].innerText;

    document.getElementById("specialization").value =
        row.cells[3].innerText;

    document.getElementById("status").value =
        row.cells[4].innerText;

}

function searchMechanic(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#mechanicTable tr"
        );

    rows.forEach(function(row,index){

        if(index === 0) return;

        let text =
            row.textContent.toLowerCase();

        if(text.includes(input)){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>
