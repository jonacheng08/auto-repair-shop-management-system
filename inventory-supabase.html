<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management - Supabase</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="dashboard-supabase.html">Dashboard</a> |
    <a href="customers-supabase.html">Customers</a> |
    <a href="vehicles-supabase.html">Vehicles</a> |
    <a href="mechanics-supabase.html">Mechanics</a> |
    <a href="inventory-supabase.html">Inventory</a> |
    <a href="services-supabase.html">Services</a> |
    <a href="billing-supabase-v2.html">Billing</a> |
    <a href="reports-supabase.html">Reports</a> |
    <a href="index.html">Logout</a>
</nav>

<h1>Inventory Management</h1>

<hr>

<h3>Add New Part</h3>

<input type="text" id="partName" placeholder="Part Name">

<br><br>

<input type="number" id="quantity" placeholder="Quantity">

<br><br>

<input type="number" id="unitPrice" placeholder="Unit Price">

<br><br>

<input type="text" id="supplier" placeholder="Supplier">

<br><br>

<button onclick="savePart()">
    Save Part
</button>

<hr>

<h3>Search Part</h3>

<input
    type="text"
    id="searchInput"
    placeholder="Search Part..."
    onkeyup="searchPart()">

<hr>

<h3>Inventory Records</h3>

<table border="1" id="inventoryTable">

<tr>
    <th>ID</th>
    <th>Part Name</th>
    <th>Quantity</th>
    <th>Unit Price</th>
    <th>Supplier</th>
    <th>Actions</th>
</tr>

</table>

<script>

const supabaseUrl =
"https://vopmdpaxxqejttenxcge.supabase.co";

const supabaseKey =
"sb_publishable_VrWfYD5jljm4i1g14UkasA_jo1lB3IM";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let editPartId = null;

window.onload = function(){

    loadParts();

};

async function loadParts(){

    const { data, error } =
        await client
        .from("inventory")
        .select("*")
        .order("id");

    if(error){

        alert(error.message);
        return;

    }

    let table =
        document.getElementById("inventoryTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Part Name</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Supplier</th>
            <th>Actions</th>
        </tr>
    `;

    data.forEach(part => {

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + part.id + "</td>" +
            "<td>" + part.part_name + "</td>" +
            "<td>" + part.quantity + "</td>" +
            "<td>" + part.unit_price + "</td>" +
            "<td>" + part.supplier + "</td>" +
            "<td>" +
            "<button onclick='editPart(" + part.id + ")'>Edit</button> " +
            "<button onclick='deletePart(" + part.id + ")'>Delete</button>" +
            "</td>";

    });

}

async function savePart(){

    let partName =
        document.getElementById("partName").value;

    let quantity =
        document.getElementById("quantity").value;

    let unitPrice =
        document.getElementById("unitPrice").value;

    let supplier =
        document.getElementById("supplier").value;

    if(
        partName === "" ||
        quantity === "" ||
        unitPrice === "" ||
        supplier === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    if(editPartId === null){

        const { error } =
            await client
            .from("inventory")
            .insert([
                {
                    part_name: partName,
                    quantity: quantity,
                    unit_price: unitPrice,
                    supplier: supplier
                }
            ]);

        if(error){
            alert(error.message);
            return;
        }

    }
    else{

        const { error } =
            await client
            .from("inventory")
            .update({
                part_name: partName,
                quantity: quantity,
                unit_price: unitPrice,
                supplier: supplier
            })
            .eq("id", editPartId);

        if(error){
            alert(error.message);
            return;
        }

        editPartId = null;

    }

    document.getElementById("partName").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("unitPrice").value = "";
    document.getElementById("supplier").value = "";

    loadParts();

}

async function editPart(id){

    const { data, error } =
        await client
        .from("inventory")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    document.getElementById("partName").value =
        data.part_name;

    document.getElementById("quantity").value =
        data.quantity;

    document.getElementById("unitPrice").value =
        data.unit_price;

    document.getElementById("supplier").value =
        data.supplier;

    editPartId = id;

}

async function deletePart(id){

    if(!confirm("Delete this part?")){
        return;
    }

    const { error } =
        await client
        .from("inventory")
        .delete()
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    loadParts();

}

function searchPart(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll("#inventoryTable tr");

    rows.forEach(function(row,index){

        if(index === 0) return;

        let text =
            row.textContent.toLowerCase();

        if(text.includes(input)){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>

</body>
</html>
