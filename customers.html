<h1>Customer Management</h1>

<hr>

<h3>Add New Customer</h3>

<input type="text" id="fullName" placeholder="Full Name">

<br><br>

<input type="text" id="contactNumber" placeholder="Contact Number">

<br><br>

<input type="email" id="email" placeholder="Email">

<br><br>

<input type="text" id="address" placeholder="Address">

<br><br>

<button onclick="addCustomer()">
    Add Customer
</button>

<hr>

<h3>Search Customer</h3>

<input type="text"
       id="searchInput"
       placeholder="Search Customer..."
       onkeyup="searchCustomer()">

<br><br>

<h3>Customer Records</h3>

<table border="1" id="customerTable">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Contact</th>
    <th>Email</th>
    <th>Address</th>
    <th>Actions</th>
</tr>

</table>

<script>

let customerId =
    Number(localStorage.getItem("customerId")) || 1;

let editCustomerId = null;

window.onload = function() {

    loadCustomers();

};

function loadCustomers() {

    let customers =
        JSON.parse(
            localStorage.getItem("customers")
        ) || [];

    let table =
        document.getElementById("customerTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
    `;

    customers.forEach(function(customer){

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + customer.id + "</td>" +
            "<td>" + customer.name + "</td>" +
            "<td>" + customer.contact + "</td>" +
            "<td>" + customer.email + "</td>" +
            "<td>" + customer.address + "</td>" +
            "<td>" +
            "<button onclick='editCustomer(this)'>Edit</button> " +
            "<button onclick='deleteCustomer(this)'>Delete</button>" +
            "</td>";

    });

}

function addCustomer() {

    let name =
        document.getElementById("fullName").value;

    let contact =
        document.getElementById("contactNumber").value;

    let email =
        document.getElementById("email").value;

    let address =
        document.getElementById("address").value;

    if(
        name === "" ||
        contact === "" ||
        email === "" ||
        address === ""
    ){
        alert("Please fill out all fields.");
        return;
    }

    let customers =
        JSON.parse(
            localStorage.getItem("customers")
        ) || [];

    if(editCustomerId !== null){

        customers = customers.filter(
            customer =>
            customer.id != editCustomerId
        );

        customers.push({
            id: Number(editCustomerId),
            name: name,
            contact: contact,
            email: email,
            address: address
        });

        editCustomerId = null;

    }
    else{

        customers.push({
            id: customerId,
            name: name,
            contact: contact,
            email: email,
            address: address
        });

        customerId++;

    }

    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );

    localStorage.setItem(
        "customerId",
        customerId
    );

    document.getElementById("fullName").value = "";
    document.getElementById("contactNumber").value = "";
    document.getElementById("email").value = "";
    document.getElementById("address").value = "";

    loadCustomers();

}

function deleteCustomer(button){

    if(confirm("Delete this customer?")){

        let row =
            button.closest("tr");

        let id =
            row.cells[0].innerText;

        let customers =
            JSON.parse(
                localStorage.getItem("customers")
            ) || [];

        customers = customers.filter(
            customer =>
            customer.id != id
        );

        localStorage.setItem(
            "customers",
            JSON.stringify(customers)
        );

        loadCustomers();

    }

}

function editCustomer(button){

    let row =
        button.closest("tr");

    editCustomerId =
        row.cells[0].innerText;

    document.getElementById("fullName").value =
        row.cells[1].innerText;

    document.getElementById("contactNumber").value =
        row.cells[2].innerText;

    document.getElementById("email").value =
        row.cells[3].innerText;

    document.getElementById("address").value =
        row.cells[4].innerText;

}

function searchCustomer(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#customerTable tr"
        );

    rows.forEach(function(row,index){

        if(index === 0) return;

        let text =
            row.textContent.toLowerCase();

        if(text.includes(input)){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>

</body>
