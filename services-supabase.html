<!DOCTYPE html>
<html>
<head>
    <title>Service Records - Supabase</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="dashboard-supabase.html">Dashboard</a> |
    <a href="customers-supabase.html">Customers</a> |
    <a href="vehicles-supabase.html">Vehicles</a> |
    <a href="mechanics-supabase.html">Mechanics</a> |
    <a href="inventory-supabase.html">Inventory</a> |
    <a href="services-supabase.html">Services</a> |
    <a href="billing-supabase-v2.html">Billing</a> |
    <a href="reports-supabase.html">Reports</a> |
    <a href="index.html">Logout</a>
</nav>

<h1>Service Records</h1>

<hr>

<input type="text" id="vehicle" placeholder="Vehicle">

<br><br>

<input type="text" id="mechanic" placeholder="Mechanic">

<br><br>

<input type="text" id="problem" placeholder="Problem Description">

<br><br>

<select id="status">
    <option value="">Select Status</option>
    <option>Pending</option>
    <option>In Progress</option>
    <option>Completed</option>
</select>

<br><br>

<input type="number" id="laborFee" placeholder="Labor Fee">

<br><br>

<button onclick="saveService()">
    Save Service Record
</button>

<hr>

<table border="1" id="serviceTable">

<tr>
    <th>ID</th>
    <th>Vehicle</th>
    <th>Mechanic</th>
    <th>Problem</th>
    <th>Status</th>
    <th>Labor Fee</th>
    <th>Actions</th>
</tr>

</table>

<script>

const supabaseUrl =
"https://vopmdpaxxqejttenxcge.supabase.co";

const supabaseKey =
"sb_publishable_VrWfYD5jljm4i1g14UkasA_jo1lB3IM";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let editServiceId = null;

window.onload = function() {
    loadServices();
};

async function loadServices(){

    const { data, error } =
        await client
        .from("services")
        .select("*")
        .order("id");

    if(error){
        alert(error.message);
        return;
    }

    let table =
        document.getElementById("serviceTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Vehicle</th>
            <th>Mechanic</th>
            <th>Problem</th>
            <th>Status</th>
            <th>Labor Fee</th>
            <th>Actions</th>
        </tr>
    `;

    data.forEach(service => {

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + service.id + "</td>" +
            "<td>" + service.vehicle + "</td>" +
            "<td>" + service.mechanic + "</td>" +
            "<td>" + service.problem + "</td>" +
            "<td>" + service.status + "</td>" +
            "<td>" + service.labor_fee + "</td>" +
            "<td>" +
            "<button onclick='editService(" + service.id + ")'>Edit</button> " +
            "<button onclick='deleteService(" + service.id + ")'>Delete</button>" +
            "</td>";

    });

}

async function saveService(){

    let vehicle =
        document.getElementById("vehicle").value;

    let mechanic =
        document.getElementById("mechanic").value;

    let problem =
        document.getElementById("problem").value;

    let status =
        document.getElementById("status").value;

    let laborFee =
        document.getElementById("laborFee").value;

    if(
        vehicle === "" ||
        mechanic === "" ||
        problem === "" ||
        status === "" ||
        laborFee === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    if(editServiceId === null){

        const { error } =
            await client
            .from("services")
            .insert([
                {
                    vehicle: vehicle,
                    mechanic: mechanic,
                    problem: problem,
                    status: status,
                    labor_fee: laborFee
                }
            ]);

        if(error){
            alert(error.message);
            return;
        }

    } else {

        const { error } =
            await client
            .from("services")
            .update({
                vehicle: vehicle,
                mechanic: mechanic,
                problem: problem,
                status: status,
                labor_fee: laborFee
            })
            .eq("id", editServiceId);

        if(error){
            alert(error.message);
            return;
        }

        editServiceId = null;

    }

    document.getElementById("vehicle").value = "";
    document.getElementById("mechanic").value = "";
    document.getElementById("problem").value = "";
    document.getElementById("status").value = "";
    document.getElementById("laborFee").value = "";

    loadServices();

}

async function editService(id){

    const { data, error } =
        await client
        .from("services")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    document.getElementById("vehicle").value =
        data.vehicle;

    document.getElementById("mechanic").value =
        data.mechanic;

    document.getElementById("problem").value =
        data.problem;

    document.getElementById("status").value =
        data.status;

    document.getElementById("laborFee").value =
        data.labor_fee;

    editServiceId = id;

}

async function deleteService(id){

    if(!confirm("Delete this service record?")){
        return;
    }

    const { error } =
        await client
        .from("services")
        .delete()
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    loadServices();

}

</script>

</body>
</html>
