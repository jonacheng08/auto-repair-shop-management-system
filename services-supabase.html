async function editService(id){

    const { data, error } =
        await client
        .from("services")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    document.getElementById("vehicle").value =
        data.vehicle;

    document.getElementById("plateNumber").value =
        data.plate_number;

    document.getElementById("mechanic").value =
        data.mechanic;

    document.getElementById("problem").value =
        data.problem;

    document.getElementById("status").value =
        data.status;

    document.getElementById("laborFee").value =
        data.labor_fee;

    editServiceId = id;

}

function searchService(){

    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#serviceTable tr"
        );

    rows.forEach(function(row,index){

        if(index === 0){
            return;
        }

        let text =
            row.textContent.toLowerCase();

        if(text.includes(input)){

            row.style.display = "";

        }
        else{

            row.style.display = "none";

        }

    });

}

async function deleteService(id){

    if(!confirm("Delete this service record?")){
        return;
    }

    const { error } =
        await client
        .from("services")
        .delete()
        .eq("id", id);

    if(error){
        alert(error.message);
        return;
    }

    await loadServices();

}
