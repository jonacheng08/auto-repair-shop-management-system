async function loadServices() {

    const { data, error } =
        await client
        .from("services")
        .select("*")
        .order("id");

    if (error) {
        alert(error.message);
        return;
    }

    let table =
        document.getElementById("serviceTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Plate Number</th>
            <th>Vehicle</th>
            <th>Mechanic</th>
            <th>Problem</th>
            <th>Status</th>
            <th>Labor Fee</th>
            <th>Actions</th>
        </tr>
    `;

    data.forEach(service => {

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + service.id + "</td>" +
            "<td>" + (service.plate_number || "") + "</td>" +
            "<td>" + service.vehicle + "</td>" +
            "<td>" + service.mechanic + "</td>" +
            "<td>" + service.problem + "</td>" +
            "<td>" + service.status + "</td>" +
            "<td>" + service.labor_fee + "</td>" +
            "<td>" +
            "<button onclick='editService(" + service.id + ")'>Edit</button> " +
            "<button onclick='deleteService(" + service.id + ")'>Delete</button>" +
            "</td>";

    });

}
