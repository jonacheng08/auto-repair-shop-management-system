<!DOCTYPE html>
<html>
<head>
    <title>Mechanic Management - Supabase</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="dashboard-supabase.html">Dashboard</a> |
    <a href="customers-supabase.html">Customers</a> |
<a href="vehicles-supabase.html">Vehicles</a> |
<a href="mechanics-supabase.html">Mechanics</a> |
<a href="inventory-supabase.html">Inventory</a> |
<a href="services-supabase.html">Services</a> |
<a href="billing-supabase-v2.html">Billing</a> |
<a href="reports-supabase.html">Reports</a> |
<a href="index.html">Logout</a>
</nav>

<h1>Mechanic Management</h1>

<hr>

<h3>Add New Mechanic</h3>

<input type="text" id="mechanicName" placeholder="Mechanic Name">

<br><br>

<input type="text" id="contactNumber" placeholder="Contact Number">

<br><br>

<input type="text" id="specialization" placeholder="Specialization">

<br><br>

<select id="status">
    <option value="">Select Status</option>
    <option>Active</option>
    <option>Inactive</option>
</select>

<br><br>

<button id="saveBtn" onclick="addMechanic()">
    Add Mechanic
</button>

<hr>

<h3>Search Mechanic</h3>

<input
    type="text"
    id="searchInput"
    placeholder="Search by Name, Contact, Specialization, or Status"
    onkeyup="searchMechanic()">

<br><br>

<hr>

<h3>Mechanic Records</h3>

<table border="1" id="mechanicTable">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Contact Number</th>
    <th>Specialization</th>
    <th>Status</th>
    <th>Action</th>
</tr>

</table>

<script>

const supabaseUrl =
"https://vopmdpaxxqejttenxcge.supabase.co";

const supabaseKey =
"sb_publishable_VrWfYD5jljm4i1g14UkasA_jo1lB3IM";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let editMechanicId = null;

window.onload = async function() {

    await loadMechanics();

};

async function loadMechanics() {

    const { data, error } =
        await client
        .from("mechanics")
        .select("*")
        .order("id");

    if(error){

        alert(error.message);
        return;

    }

    let table =
        document.getElementById("mechanicTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact Number</th>
            <th>Specialization</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    `;

    data.forEach(mechanic => {

        let row =
            table.insertRow(-1);

        row.innerHTML =
        "<td>" + mechanic.id + "</td>" +
        "<td>" + mechanic.name + "</td>" +
        "<td>" + mechanic.contact + "</td>" +
        "<td>" + mechanic.specialization + "</td>" +
        "<td>" + mechanic.status + "</td>" +
        "<td>" +
        "<button onclick='editMechanic(" + mechanic.id + ")'>Edit</button> " +
        "<button onclick='deleteMechanic(" + mechanic.id + ")'>Delete</button>" +
        "</td>";

    });

}

async function addMechanic() {

    const mechanicData = {

        name:
            document.getElementById("mechanicName").value,

        contact:
            document.getElementById("contactNumber").value,

        specialization:
            document.getElementById("specialization").value,

        status:
            document.getElementById("status").value

    };

    let result;

    if(editMechanicId !== null){

        result =
            await client
            .from("mechanics")
            .update(mechanicData)
            .eq("id", editMechanicId);

    }
    else{

        result =
            await client
            .from("mechanics")
            .insert([mechanicData]);

    }

    if(result.error){

        alert(result.error.message);
        return;

    }

    document.getElementById("mechanicName").value = "";
    document.getElementById("contactNumber").value = "";
    document.getElementById("specialization").value = "";
    document.getElementById("status").value = "";

    editMechanicId = null;

    document.getElementById("saveBtn").innerText =
        "Add Mechanic";

    await loadMechanics();


}
async function editMechanic(id){

    const { data, error } =
        await client
        .from("mechanics")
        .select("*")
        .eq("id", id)
        .single();

    if(error){

        alert(error.message);
        return;

    }

    editMechanicId = id;

    document.getElementById("mechanicName").value =
        data.name;

    document.getElementById("contactNumber").value =
        data.contact;

    document.getElementById("specialization").value =
        data.specialization;

    document.getElementById("status").value =
        data.status;

    document.getElementById("saveBtn").innerText =
        "Update Mechanic";

}

function searchMechanic(){

let input =
document.getElementById("searchInput")
.value
.toLowerCase();

let rows =
document.querySelectorAll(
"#mechanicTable tr"
);

rows.forEach(function(row, index){

if(index === 0){
return;
}

let text =
row.textContent.toLowerCase();

if(text.includes(input)){

row.style.display = "";

}
else{

row.style.display = "none";

}

});

}

async function deleteMechanic(id){

    if(!confirm("Delete this mechanic?")){

        return;

    }

    const { error } =
        await client
        .from("mechanics")
        .delete()
        .eq("id", id);

    if(error){

        alert(error.message);
        return;

    }

    await loadMechanics();

}

</script>

</body>
</html>
