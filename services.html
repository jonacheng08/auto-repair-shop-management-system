<!DOCTYPE html>
<html>
<head>
    <title>Service Records</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav>

<a href="customers.html">Customers</a> |

<a href="services.html">Services</a> |
<a href="inventory.html">Inventory</a> |
<a href="billing.html">Billing</a> |
<a href="reports.html">Reports</a> |
<a href="index.html">Logout</a>
</nav>
<h1>Service Records</h1>

<hr>

<h3>Create Repair Order</h3>

<input type="text" id="vehicle" placeholder="Vehicle">

<br><br>

<input type="text" id="mechanic" placeholder="Mechanic">

<br><br>

<input type="text" id="problem" placeholder="Problem Description">

<br><br>

<select id="status">
    <option value="">Select Status</option>
    <option>Pending</option>
    <option>In Progress</option>
    <option>Completed</option>
</select>

<br><br>

<input type="number" id="laborFee" placeholder="Labor Fee">

<br><br>

<button onclick="addService()">Create Service Record</button>

<hr>

<h3>Service Records</h3>

<table border="1" id="serviceTable">

<tr>
    <th>ID</th>
    <th>Vehicle</th>
    <th>Mechanic</th>
    <th>Problem</th>
    <th>Status</th>
    <th>Labor Fee</th>
    <th>Actions</th>
</tr>

</table>

<script>

let serviceId =
    Number(localStorage.getItem("serviceId")) || 1;

let editServiceId = null;

window.onload = function() {

    loadServices();

};

function loadServices() {

    let services =
        JSON.parse(
            localStorage.getItem("services")
        ) || [];

    let table =
        document.getElementById("serviceTable");

    table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Vehicle</th>
            <th>Mechanic</th>
            <th>Problem</th>
            <th>Status</th>
            <th>Labor Fee</th>
            <th>Actions</th>
        </tr>
    `;

    services.forEach(function(service){

        let row =
            table.insertRow(-1);

        row.innerHTML =
            "<td>" + service.id + "</td>" +
            "<td>" + service.vehicle + "</td>" +
            "<td>" + service.mechanic + "</td>" +
            "<td>" + service.problem + "</td>" +
            "<td>" + service.status + "</td>" +
            "<td>" + service.laborFee + "</td>" +
            "<td>" +
            "<button onclick='editService(this)'>Edit</button> " +
            "<button onclick='deleteService(this)'>Delete</button>" +
            "</td>";

    });

}

function addService() {

    let vehicle =
        document.getElementById("vehicle").value;

    let mechanic =
        document.getElementById("mechanic").value;

    let problem =
        document.getElementById("problem").value;

    let status =
        document.getElementById("status").value;

    let laborFee =
        document.getElementById("laborFee").value;

    if(
        vehicle === "" ||
        mechanic === "" ||
        problem === "" ||
        status === "" ||
        laborFee === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    let services =
        JSON.parse(
            localStorage.getItem("services")
        ) || [];

    if(editServiceId !== null){

        services = services.filter(
            service =>
            service.id != editServiceId
        );

        services.push({
            id: Number(editServiceId),
            vehicle: vehicle,
            mechanic: mechanic,
            problem: problem,
            status: status,
            laborFee: laborFee
        });

        editServiceId = null;

    }
    else{

        services.push({
            id: serviceId,
            vehicle: vehicle,
            mechanic: mechanic,
            problem: problem,
            status: status,
            laborFee: laborFee
        });

        serviceId++;

    }

    localStorage.setItem(
        "services",
        JSON.stringify(services)
    );

    localStorage.setItem(
        "serviceId",
        serviceId
    );

    document.getElementById("vehicle").value = "";
    document.getElementById("mechanic").value = "";
    document.getElementById("problem").value = "";
    document.getElementById("status").value = "";
    document.getElementById("laborFee").value = "";

    loadServices();

}

function deleteService(button){

    let row =
        button.closest("tr");

    let id =
        row.cells[0].innerText;

    let services =
        JSON.parse(
            localStorage.getItem("services")
        ) || [];

    services = services.filter(
        service =>
        service.id != id
    );

    localStorage.setItem(
        "services",
        JSON.stringify(services)
    );

    loadServices();

}

function editService(button){

    let row =
        button.closest("tr");

    editServiceId =
        row.cells[0].innerText;

    document.getElementById("vehicle").value =
        row.cells[1].innerText;

    document.getElementById("mechanic").value =
        row.cells[2].innerText;

    document.getElementById("problem").value =
        row.cells[3].innerText;

    document.getElementById("status").value =
        row.cells[4].innerText;

    document.getElementById("laborFee").value =
        row.cells[5].innerText;

}

</script>

</body>
</html>
